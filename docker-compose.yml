services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: research_agent
      POSTGRES_PASSWORD: research_agent
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_agent -d research_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/research-agent-local
    ports: ["7474:7474", "7687:7687"]
  migrate:
    build:
      context: .
      target: worker
    command: ["node", "dist/migrate-main.js"]
    environment:
      NODE_ENV: development
      PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://research_agent:research_agent@postgres:5432/research_agent
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["maintenance"]
